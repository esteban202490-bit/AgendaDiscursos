<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de Discursos</title>
<meta name="theme-color" content="#1f2430">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1f26;--mu:#727077;--pr:#1f2430;--ln:#e6e1d6;--ac:#8a6118;--dg:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111318;--card:#1b1e26;--tx:#f1ede4;--mu:#a7a39a;--pr:#2b3040;--ln:#2c303b;--ac:#e0b457}}
:root[data-theme="dark"]{--bg:#111318;--card:#1b1e26;--tx:#f1ede4;--mu:#a7a39a;--pr:#2b3040;--ln:#2c303b;--ac:#e0b457}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:100px}
header{background:var(--pr);color:#fff;padding:18px 16px}header h1{margin:0;font-size:20px}
main{padding:14px;max-width:640px;margin:auto}
h3{margin:18px 0 6px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:8px 0}
.r{display:flex;gap:12px;align-items:center}
.n{background:var(--pr);color:#fff;border-radius:10px;padding:10px 6px;min-width:58px;text-align:center;font-weight:700}
.g{flex:1;min-width:0}.t{font-weight:600}.m{color:var(--mu);font-size:14px}
.b{display:block;width:100%;padding:16px;border:0;border-radius:14px;background:var(--pr);color:#fff;font:600 17px inherit;margin:10px 0}
.b.s{background:var(--card);color:var(--tx);border:1px solid var(--ln)}.b.d{background:var(--dg)}
input,select,textarea{width:100%;padding:14px;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin:6px 0}
label{display:block;font-size:14px;color:var(--mu);margin-top:8px}
summary{padding:12px 0;font-weight:600;color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0;font-size:11px}nav button.on{color:var(--ac);font-weight:700}nav span{display:block;font-size:21px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--pr);color:#fff;font-size:30px;box-shadow:0 4px 12px #0004;z-index:5}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:9}
.sh{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sh h2{margin:0 0 8px;font-size:19px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st .c{text-align:center;color:var(--mu);font-size:14px}.st b{font-size:32px;display:block;color:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal small{color:var(--mu)}
.dy{position:relative;aspect-ratio:1;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);font-size:15px;padding:0}
.dy u{position:absolute;bottom:2px;right:3px;font-size:10px;text-decoration:none;background:var(--ac);color:#fff;border-radius:8px;padding:0 5px}
.dy.on{background:var(--pr);color:#fff}.dy.td{border:2px solid var(--ac)}
.mh{display:flex;align-items:center;justify-content:space-between;margin:6px 0}.mh button{width:48px;height:44px;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);font-size:20px}
#ts{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));background:#111c;color:#fff;padding:12px;border-radius:12px;text-align:center;opacity:0;transition:.3s;pointer-events:none;z-index:99}
button{font-family:inherit}
header{background:linear-gradient(135deg,#14161d,#343a4d);border-bottom:3px solid #c9a24a;padding:20px 16px 18px}header h1{font-size:21px}header p{margin:2px 0 0;font-size:13px;opacity:.8}
.b{font:600 17px system-ui,sans-serif;box-shadow:0 2px 6px #1f243033}.b.s{box-shadow:none}
.c{box-shadow:0 1px 3px #1f24301a}
.c:active,.b:active,.dy:active{transform:scale(.98)}
.n{background:linear-gradient(135deg,var(--pr),#3d4358)}
.dy.on{background:linear-gradient(135deg,var(--pr),#3d4358)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
main{animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
</style></head>
<body>
<header><h1>Agenda de Discursos</h1><p>Historial de discursos públicos</p></header>
<main id="app"></main>
<button class="fab" onclick="openForm()" aria-label="Agregar registro">＋</button>
<nav>
<button data-v="home" onclick="go('home')"><span>🏠</span>Inicio</button>
<button data-v="rec" onclick="go('rec')"><span>📋</span>Registros</button>
<button data-v="bq" onclick="go('bq')"><span>📖</span>Bosquejos</button>
<button data-v="cal" onclick="go('cal')"><span>📅</span>Calendario</button>
<button data-v="set" onclick="go('set')"><span>⚙️</span>Ajustes</button>
</nav>
<div id="ts"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const p2=n=>String(n).padStart(2,'0');
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fd=d=>d?d.split('-').reverse().join('/'):'';
const wd=d=>['dom','lun','mar','mié','jue','vie','sáb'][new Date(d+'T00:00:00').getDay()];
const lastYear=()=>{const n=new Date();return(n.getFullYear()-1)+'-'+p2(n.getMonth()+1)+'-'+p2(n.getDate())};
const today=()=>{const n=new Date();return n.getFullYear()+'-'+p2(n.getMonth()+1)+'-'+p2(n.getDate())};
const byDate=(a,b)=>b.date.localeCompare(a.date)||b.id-a.id;
let db,D=[],PIN=null;
const st={v:'home',q:'',lim:60,bq:'',bo:'mas',bl:60,cm:new Date(),cd:null,f:{n:'',t:'',c:'',a:'',b:'',o:'rec'}};

/* ---------- Almacenamiento ---------- */
const openDB=()=>new Promise((ok,ko)=>{const r=indexedDB.open('agendaDiscursos',1);
 r.onupgradeneeded=()=>{r.result.createObjectStore('reg',{keyPath:'id',autoIncrement:true});r.result.createObjectStore('meta')};
 r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>ko(r.error)});
const tx=(s,m,f)=>new Promise((ok,ko)=>{const t=db.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>ko(t.error)});
const load=async()=>{D=await tx('reg','readonly',s=>s.getAll())};
const meta=(k,v)=>v===undefined?tx('meta','readonly',s=>s.get(k)):tx('meta','readwrite',s=>v===null?s.delete(k):s.put(v,k));
async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ad'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'x'+btoa(p)}}

/* ---------- Utilidades de datos ---------- */
function groups(){const m=new Map();D.forEach(x=>{let g=m.get(x.num);if(!g){g={num:x.num,items:[],count:0,last:'',title:''};m.set(x.num,g)}g.items.push(x);g.count++;if(x.date>=g.last){g.last=x.date;g.title=x.title}});return m}
const cs=k=>[...new Set(D.map(x=>x[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
const uniq=k=>cs(k).map(v=>`<option value="${esc(v)}">`).join('');
function ago(d){const a=new Date(d+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);if(a>n)return'fecha futura';
 let y=n.getFullYear()-a.getFullYear(),m=n.getMonth()-a.getMonth(),dd=n.getDate()-a.getDate();
 if(dd<0){m--;dd+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}
 if(!y&&!m)return dd?'hace '+dd+(dd>1?' días':' día'):'hoy';
 const p=[];if(y)p.push(y+(y>1?' años':' año'));if(m)p.push(m+(m>1?' meses':' mes'));return'hace '+p.join(' y ')}
function filt(){const f=st.f,q=norm(st.q),cnt={};D.forEach(x=>cnt[x.num]=(cnt[x.num]||0)+1);
 const r=D.filter(x=>(!q||norm(x.num+' '+x.title+' '+x.cong+' '+x.sp).includes(q))&&(!f.n||String(x.num)===f.n.trim())&&(!f.t||norm(x.title).includes(norm(f.t)))&&(!f.c||x.cong===f.c)&&(!f.a||x.date>=f.a)&&(!f.b||x.date<=f.b));
 r.sort(f.o=='ant'?(a,b)=>a.date.localeCompare(b.date)||a.id-b.id:f.o=='mas'?(a,b)=>cnt[b.num]-cnt[a.num]||byDate(a,b):f.o=='men'?(a,b)=>cnt[a.num]-cnt[b.num]||byDate(a,b):byDate);return r}

/* ---------- Interfaz ---------- */
const card=x=>`<div class="c"><div class="r"><b class="n" onclick="hist(${x.num})">#${x.num}</b><div class="g" onclick="openForm(${x.id})"><div class="t">${esc(x.title)}</div><div class="m">${wd(x.date)} ${fd(x.date)} · ${esc(x.cong)}${x.sp?' · '+esc(x.sp):''}</div></div></div></div>`;
const VIEWS={
home:()=>{const rc=[...D].sort(byDate).slice(0,8);
 return`<div class="st"><div class="c"><b>${D.length}</b>Registros</div><div class="c"><b>${new Set(D.map(x=>x.num)).size}</b>Bosquejos distintos</div><div class="c"><b>${D.filter(x=>x.date.startsWith(String(new Date().getFullYear()))).length}</b>Este año</div><div class="c"><b>${cs('cong').length}</b>Congregaciones</div></div>
 <button class="b" onclick="openForm()">＋ Agregar registro</button>${bkWarn()}
 <input type="search" placeholder="🔍 Buscar número, título, congregación…" oninput="gs(this.value)">
 ${sug()}${topC()}<h3>Últimos discursos</h3>${rc.map(card).join('')||'<p class="m">Aún no hay registros. Toca «Agregar registro» para comenzar.</p>'}
 ${rc.length?'<p class="m">Toca el número para ver su historial, o el resto para editar.</p>':''}`},
rec:()=>{const f=st.f,op=(v,t)=>`<option value="${v}"${f.o==v?' selected':''}>${t}</option>`;
 return`<input id="q" type="search" placeholder="🔍 Buscar…" value="${esc(st.q)}" oninput="st.q=this.value;st.lim=60;dl()">
 <details><summary>Filtros y orden</summary>
 <input type="number" inputmode="numeric" placeholder="Nº de bosquejo" value="${esc(f.n)}" oninput="fl('n',this.value)">
 <input type="search" placeholder="Título contiene…" value="${esc(f.t)}" oninput="fl('t',this.value)">
 <select onchange="fl('c',this.value)"><option value="">Todas las congregaciones</option>${cs('cong').map(c=>`<option${f.c==c?' selected':''}>${esc(c)}</option>`).join('')}</select>
 <label>Desde</label><input type="date" value="${f.a}" onchange="fl('a',this.value)">
 <label>Hasta</label><input type="date" value="${f.b}" onchange="fl('b',this.value)">
 <label>Ordenar por</label><select onchange="fl('o',this.value)">${op('rec','Más recientes')}${op('ant','Más antiguos')}${op('mas','Bosquejos más presentados')}${op('men','Bosquejos menos presentados')}</select>
 <button class="b s" onclick="st.f={n:'',t:'',c:'',a:'',b:'',o:'rec'};st.q='';render()">Limpiar filtros</button></details>
 <div id="lst"></div>`},
bq:()=>{const op=(v,t)=>`<option value="${v}"${st.bo==v?' selected':''}>${t}</option>`;
 return`<input id="bqi" type="search" placeholder="🔍 Número o título…" value="${esc(st.bq)}" oninput="st.bq=this.value;st.bl=60;db2()">
 <select onchange="st.bo=this.value;st.bl=60;db2()">${op('mas','Más presentados')}${op('men','Menos presentados')}${op('num','Por número')}${op('rec','Presentados recientemente')}${op('ant','Más tiempo sin presentarse')}</select>
 <div id="blst"></div>`},
cal:()=>{const y=st.cm.getFullYear(),m=st.cm.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),pre=y+'-'+p2(m+1)+'-';
 const by={};D.forEach(x=>{if(x.date.startsWith(pre))by[x.date]=(by[x.date]||0)+1});
 let cells='';for(let i=0;i<first;i++)cells+='<i></i>';
 for(let d=1;d<=days;d++){const k=pre+p2(d);cells+=`<button class="dy${k==st.cd?' on':''}${k==today()?' td':''}" onclick="st.cd='${k}';render()">${d}${by[k]?`<u>${by[k]}</u>`:''}</button>`}
 const sel=st.cd?D.filter(x=>x.date==st.cd).sort(byDate):[];
 return`<div class="mh"><button onclick="mv(-1)">‹</button><b style="font-size:18px">${MES[m][0].toUpperCase()+MES[m].slice(1)} ${y}</b><button onclick="mv(1)">›</button></div>
 <button class="b s" style="padding:10px;font-size:14px;margin:4px 0 10px" onclick="st.cm=new Date();st.cd=today();render()">Ir a hoy</button><div class="cal">${['L','M','X','J','V','S','D'].map(d=>`<small>${d}</small>`).join('')}${cells}</div>
 ${st.cd?`<h3>${fd(st.cd)}</h3>${sel.map(card).join('')||'<p class="m">Sin registros en esta fecha.</p>'}<button class="b" onclick="openForm(0,'${st.cd}')">＋ Agregar en esta fecha</button>`:'<p class="m">Toca una fecha para ver sus discursos.</p>'}`},
set:()=>`<h3>Copia de seguridad</h3><p class="m">Última copia: ${BK?fd(new Date(BK).toISOString().slice(0,10)):'ninguna'}</p>
 <button class="b" onclick="exp()">⬇ Exportar copia (archivo)</button>
 <button class="b s" onclick="cp()">Copiar copia al portapapeles</button>
 <button class="b s" onclick="impUI()">⬆ Importar copia</button>
 <button class="b s" onclick="csv()">Exportar a Excel (CSV)</button>
 <h3>Instalación</h3><button class="b s" onclick="inst()">📲 Instalar en este celular</button><h3>Seguridad</h3><p class="m">PIN: ${PIN?'activado':'desactivado'}</p>
 <button class="b s" onclick="pinUI()">${PIN?'Cambiar PIN':'Activar PIN'}</button>
 ${PIN?'<button class="b s" onclick="pinOff()">Quitar PIN</button>':''}
 <button class="b s" style="color:#d9483b" onclick="wipe()">Borrar todos los datos</button><p class="m">Los datos se guardan en este dispositivo (IndexedDB) y funcionan sin Internet. Haz copias de seguridad con regularidad.</p>`};
function render(){$('#app').innerHTML=VIEWS[st.v]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==st.v));if(st.v=='rec')dl();if(st.v=='bq')db2()}
function go(v){st.v=v;render();scrollTo(0,0)}
function gs(v){st.q=v;st.lim=60;st.v='rec';render();const q=$('#q');q.focus();q.setSelectionRange(v.length,v.length)}
function fl(k,v){st.f[k]=v;st.lim=60;dl()}
function dl(){const r=filt();$('#lst').innerHTML=`<p class="m">${r.length} registro${r.length==1?'':'s'}</p>`+r.slice(0,st.lim).map(card).join('')+(r.length>st.lim?'<button class="b s" onclick="st.lim+=60;dl()">Mostrar más</button>':'')}
function db2(){const q=norm(st.bq),o=st.bo;const a=[...groups().values()].filter(g=>!q||norm(g.num+' '+g.title).includes(q));
 a.sort(o=='mas'?(x,y)=>y.count-x.count||x.num-y.num:o=='men'?(x,y)=>x.count-y.count||x.num-y.num:o=='ant'?(x,y)=>x.last.localeCompare(y.last):o=='rec'?(x,y)=>y.last.localeCompare(x.last):(x,y)=>x.num-y.num);
 $('#blst').innerHTML=`<p class="m">${a.length} bosquejo${a.length==1?'':'s'}</p>`+a.slice(0,st.bl).map(g=>`<div class="c" onclick="hist(${g.num})"><div class="r"><b class="n">#${g.num}</b><div class="g"><div class="t">${esc(g.title)}</div><div class="m">${g.count} ${g.count>1?'veces':'vez'} · última: ${fd(g.last)} (${ago(g.last)})</div></div></div></div>`).join('')+(a.length>st.bl?'<button class="b s" onclick="st.bl+=60;db2()">Mostrar más</button>':'')}
function mv(d){st.cm=new Date(st.cm.getFullYear(),st.cm.getMonth()+d,1);st.cd=null;render()}
function toast(m){const t=$('#ts');t.textContent=m;t.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.opacity=0,2400)}

function qd(w){const d=new Date();if(w!=='h')d.setDate(d.getDate()+((w-d.getDay()+7)%7));$('#i3').value=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
let IP=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();IP=e});
function inst(){if(IP){IP.prompt();IP=null}else toast('Usa el menú ⋮ de Chrome → Instalar aplicación')}
function shareH(n){const g=groups().get(n);if(!g)return;const t=['Bosquejo #'+n+' – '+g.title,'Presentado '+g.count+(g.count>1?' veces':' vez')+'. Última: '+fd(g.last)+' ('+ago(g.last)+')',...g.items.sort(byDate).map(x=>'• '+fd(x.date)+' – '+x.cong+(x.sp?' – '+x.sp:''))].join(String.fromCharCode(10));if(navigator.share)navigator.share({text:t}).catch(()=>{});else navigator.clipboard.writeText(t).then(()=>toast('Historial copiado'),()=>toast('No se pudo copiar'))}
function topC(){const m={};D.forEach(x=>m[x.cong]=(m[x.cong]||0)+1);const a=Object.entries(m).sort((x,y)=>y[1]-x[1]).slice(0,3);return a.length<2?'':'<h3>Congregaciones frecuentes</h3><div class="c">'+a.map(([c,n])=>`<div class="r" style="justify-content:space-between;padding:4px 0"><span>${esc(c)}</span><b>${n}</b></div>`).join('')+'</div>'}
function csv(){const q=v=>'"'+String(v||'').replace(/"/g,'""')+'"',L=['Bosquejo,Título,Fecha,Congregación,Discursante',...[...D].sort(byDate).map(x=>[x.num,q(x.title),x.date,q(x.cong),q(x.sp)].join(','))].join(String.fromCharCode(13,10));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([String.fromCharCode(65279)+L],{type:'text/csv'}));a.download='discursos-'+today()+'.csv';document.body.appendChild(a);a.click();a.remove();toast('Archivo CSV generado')}
function wipe(){ask('¿Borrar TODOS los registros? Haz antes una copia de seguridad. No se puede deshacer.',async()=>{await tx('reg','readwrite',o=>o.clear());await load();closeSheet();render();toast('Datos borrados')},'Borrar todo')}
let BK=null;
function markBk(){BK=Date.now();meta('bk',BK)}
function sug(){const a=[...groups().values()].sort((x,y)=>x.last.localeCompare(y.last)).slice(0,3);return a.length<3?'':'<h3>Más tiempo sin presentarse</h3>'+a.map(g=>`<div class="c" onclick="hist(${g.num})"><div class="r"><b class="n">#${g.num}</b><div class="g"><div class="t">${esc(g.title)}</div><div class="m">${ago(g.last)} · ${g.count} ${g.count>1?'veces':'vez'}</div></div></div></div>`).join('')}
function bkWarn(){if(!D.length)return'';const d=BK?(Date.now()-BK)/864e5:999;return d>30?`<div class="c" style="border-color:var(--ac)" onclick="go('set')"><b>Haz una copia de seguridad</b><div class="m">${BK?'Han pasado más de 30 días desde la última copia.':'Aún no has hecho ninguna copia.'} Toca para ir a Ajustes.</div></div>`:''}
/* ---------- Ventanas ---------- */
function sheet(h){closeSheet();const o=document.createElement('div');o.id='ov';o.className='ov';o.onclick=e=>{if(e.target===o)closeSheet()};o.innerHTML='<div class="sh">'+h+'</div>';document.body.appendChild(o)}
function closeSheet(){const o=$('#ov');if(o)o.remove()}
function ask(msg,fn,label){sheet(`<h2>${msg}</h2><button class="b d" id="ok">${label||'Eliminar'}</button><button class="b s" onclick="closeSheet()">Cancelar</button>`);$('#ok').onclick=async()=>{await fn()}}
function hist(n){const g=groups().get(n);if(!g)return;
 sheet(`<h2>#${n} · ${esc(g.title)}</h2>
 <div class="st"><div class="c"><b>${g.count}</b>veces presentado</div><div class="c"><b style="font-size:20px">${fd(g.last)}</b>última presentación</div></div>
 <p>Tiempo transcurrido: <b>${ago(g.last)}</b></p><h3>Historial completo</h3>
 ${g.items.sort(byDate).map(x=>`<div class="c" onclick="openForm(${x.id})"><div class="t">${fd(x.date)}</div><div class="m">${esc(x.cong)}${x.sp?' · '+esc(x.sp):''}</div></div>`).join('')}
 <button class="b" onclick="openForm(0,0,${n})">＋ Registrar otra presentación</button><button class="b s" onclick="shareH(${n})">Compartir historial</button><button class="b s" onclick="closeSheet()">Cerrar</button>`)}
function openForm(id,date,num){const x=id?D.find(r=>r.id===id):{date:date||st.ld||today(),num:num||'',title:num?groups().get(num).title:''};if(!x)return;
 sheet(`<h2>${id?'Editar':'Nuevo'} registro</h2>
 <label>Número de bosquejo</label><input id="i1" type="number" inputmode="numeric" min="1" value="${x.num||''}"><div id="hn" class="m"></div>
 <label>Título del discurso</label><input id="i2" value="${esc(x.title||'')}">
 <label>Fecha de presentación</label><input id="i3" type="date" value="${x.date}"><div style="display:flex;gap:8px"><button class="b s" style="flex:1;width:auto;margin:2px 0;padding:10px;font-size:14px" onclick="qd('h')">Hoy</button><button class="b s" style="flex:1;width:auto;margin:2px 0;padding:10px;font-size:14px" onclick="qd(6)">Próx. sábado</button><button class="b s" style="flex:1;width:auto;margin:2px 0;padding:10px;font-size:14px" onclick="qd(0)">Próx. domingo</button></div>
 <label>Congregación de procedencia</label><input id="i4" list="lc" value="${esc(x.cong||'')}">
 <label>Hermano discursante (opcional)</label><input id="i5" list="ls" value="${esc(x.sp||'')}">
 <datalist id="lc">${uniq('cong')}</datalist><datalist id="ls">${uniq('sp')}</datalist>
 <button class="b" onclick="save(${id||0},0)">Guardar</button>
 ${id?`<button class="b d" onclick="del(${id})">Eliminar</button>`:'<button class="b s" onclick="save(0,1)">Guardar y agregar otro (misma fecha)</button>'}
 <button class="b s" onclick="closeSheet()">Cancelar</button>`);
 const t=$('#i2');t.oninput=()=>delete t.dataset.a;
 const hn=()=>{const g=groups().get(+$('#i1').value);const h=$('#hn'),rp=g&&g.last>=lastYear();h.textContent=g?(rp?'⚠ ':'')+'Ya presentado '+g.count+(g.count>1?' veces':' vez')+' · última: '+fd(g.last)+' ('+ago(g.last)+')'+(rp?' — hace menos de un año':''):'';h.style.color=rp?'#d9483b':''};hn();
 $('#i1').oninput=e=>{hn();const g=groups().get(+e.target.value);if(g&&(!t.value||t.dataset.a)){t.value=g.title;t.dataset.a=1}}}
async function save(id,more){const n=+$('#i1').value,t=$('#i2').value.trim(),d=$('#i3').value,c=$('#i4').value.trim(),s=$('#i5').value.trim();
 if(!(n>0)||!t||!d||!c)return toast('Completa número, título, fecha y congregación');
 if(!id&&D.some(x=>x.num===n&&x.date===d&&x.cong===c))return toast('Ya existe ese registro');
 const r={num:n,title:t,date:d,cong:c,sp:s};if(id)r.id=id;
 try{await tx('reg','readwrite',o=>o.put(r));await load()}catch(e){return toast('No se pudo guardar')}
 st.ld=d;toast('Registro guardado');if(more){openForm(0,d)}else{closeSheet()}render()}
function del(id){ask('¿Eliminar este registro? No se puede deshacer.',async()=>{await tx('reg','readwrite',o=>o.delete(id));await load();closeSheet();render();toast('Registro eliminado')})}

/* ---------- Copias de seguridad ---------- */
const dump=()=>JSON.stringify({app:'agenda-discursos',v:1,fecha:new Date().toISOString(),reg:D.map(({id,...r})=>r)});
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([dump()],{type:'application/json'}));a.download='agenda-discursos-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();markBk();toast('Copia generada ('+D.length+' registros)')}
function cp(){navigator.clipboard.writeText(dump()).then(()=>{markBk();toast('Copia copiada al portapapeles')},()=>toast('No se pudo copiar'))}
function impUI(){sheet(`<h2>Importar copia</h2><p class="m">Los registros nuevos se combinan con los existentes; los duplicados se omiten.</p>
 <input id="fi" type="file" accept=".json,application/json"><label>…o pega aquí el texto de la copia</label><textarea id="ft" rows="4"></textarea>
 <button class="b" id="go">Importar</button><button class="b s" onclick="closeSheet()">Cancelar</button>`);
 $('#go').onclick=async()=>{try{const f=$('#fi').files[0];imp(f?await f.text():$('#ft').value)}catch(e){toast('Archivo no válido')}}}
async function imp(txt){let o;try{o=JSON.parse(txt)}catch(e){return toast('Copia no válida')}
 const a=Array.isArray(o)?o:o.reg;if(!Array.isArray(a))return toast('Copia no válida');
 const k=r=>[r.num,r.date,r.cong,r.sp||''].join('|'),have=new Set(D.map(k));let n=0;
 const rows=a.filter(r=>r&&+r.num>0&&r.title&&/^\d{4}-\d\d-\d\d$/.test(r.date)&&r.cong).map(r=>({num:+r.num,title:String(r.title),date:r.date,cong:String(r.cong),sp:String(r.sp||'')})).filter(r=>{if(have.has(k(r)))return false;have.add(k(r));return true});
 await tx('reg','readwrite',s=>{rows.forEach(r=>{s.add(r);n++})});await load();closeSheet();render();toast(n+' registros importados')}

/* ---------- PIN ---------- */
function pinUI(){sheet(`<h2>${PIN?'Nuevo PIN':'Activar PIN'}</h2><p class="m">De 4 a 8 dígitos. Si lo olvidas no podrás entrar, así que guarda una copia de seguridad.</p><input id="pn" type="password" inputmode="numeric" maxlength="8" placeholder="PIN"><button class="b" id="pg">Guardar PIN</button><button class="b s" onclick="closeSheet()">Cancelar</button>`);
 $('#pg').onclick=async()=>{const v=$('#pn').value;if(!/^\d{4,8}$/.test(v))return toast('El PIN debe tener de 4 a 8 dígitos');PIN=await hash(v);await meta('pin',PIN);closeSheet();render();toast('PIN activado')}}
function pinOff(){ask('¿Quitar la protección con PIN?',async()=>{PIN=null;await meta('pin',null);closeSheet();render();toast('PIN desactivado')},'Quitar PIN')}
function lock(){if(!PIN||$('#lk'))return;const d=document.createElement('div');d.id='lk';d.className='ov';d.style.cssText='align-items:center;background:var(--pr);z-index:99';
 d.innerHTML=`<div style="width:100%;padding:28px;color:#fff;text-align:center"><h2>Agenda de Discursos</h2><p>Introduce tu PIN</p><input id="lp" type="password" inputmode="numeric" placeholder="PIN" maxlength="8" style="text-align:center;font-size:24px" onkeydown="if(event.key=='Enter')unl()"><div id="le" style="min-height:24px"></div><button class="b s" onclick="unl()">Entrar</button></div>`;document.body.appendChild(d)}
async function unl(){if(await hash($('#lp').value)===PIN)$('#lk').remove();else{$('#le').textContent='PIN incorrecto';$('#lp').value=''}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)lock()});

/* ---------- Inicio ---------- */
(async()=>{
 try{await openDB();await load();PIN=(await meta('pin'))||null;BK=(await meta('bk'))||null;if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}
 catch(e){$('#app').innerHTML='<div class="c"><b>No se pudo abrir el almacenamiento local.</b><p class="m">Abre la aplicación en el navegador (Chrome) fuera de modo privado.</p></div>';return}
 render();lock();
 try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script></body></html>
